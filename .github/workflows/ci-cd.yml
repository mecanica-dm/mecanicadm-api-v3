name: CI/CD - API Mecânica DM (build + push imagem)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REPO: ${{ secrets.DOCKER_IMAGE_REPO }}
  IMAGE_TAG: prod-${{ github.sha }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn -B clean verify

  build-and-push-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO }}:prod-latest

      - name: Start deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_PAT }}
          repository: mecanica-dm/mecanicadm-k8s-v3
          event-type: app-image-published
          client-payload: >-
            {"image_tag": "${{ env.IMAGE_TAG }}", "repository": "${{ env.IMAGE_REPO }}"}
